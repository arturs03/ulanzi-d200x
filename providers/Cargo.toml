[workspace]
members = ["crates/protocol", "crates/fixture", "crates/system"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["formatting"] }
d200x-provider-protocol = { path = "crates/protocol" }
